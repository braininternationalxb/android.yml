name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Download Manual Gradle Engine
      run: |
        wget -q https://gradle.org
        sudo unzip -q gradle-8.2-bin.zip -d /opt
        echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

    - name: Build Debug APK
      run: |
        gradle assembleDebug -Dorg.gradle.project.cache.disable=true -Dorg.gradle.vfs.watch=false --no-daemon --no-configuration-cache
